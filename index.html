<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طنین‌فای | Taninfy Music</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        body {
            background-color: #0b0710;
            background-image: 
                radial-gradient(circle at 80% 20%, rgba(88, 28, 135, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 20% 80%, rgba(76, 29, 149, 0.2) 0%, transparent 40%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        /* آیکون منو و صدا در بالا */
        .top-bar {
            position: absolute;
            top: 30px;
            left: 40px;
            right: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .icon-wave {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 20px;
        }
        .icon-wave span {
            width: 3px;
            background: #a78bfa;
            animation: pulse 1.2s infinite ease-in-out;
        }
        .icon-wave span:nth-child(1) { height: 10px; animation-delay: 0.1s; }
        .icon-wave span:nth-child(2) { height: 18px; animation-delay: 0.3s; }
        .icon-wave span:nth-child(3) { height: 14px; animation-delay: 0.2s; }
        .icon-wave span:nth-child(4) { height: 8px; animation-delay: 0.4s; }

        .menu-icon {
            display: flex;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
        }
        .menu-icon span {
            width: 24px;
            height: 2px;
            background: #d8b4fe;
        }

        /* بخش اصلی هدر و نام */
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 600px;
        }
        .audio-wave-top {
            width: 150px;
            height: 35px;
            margin-bottom: 10px;
            opacity: 0.8;
        }
        .brand-title {
            font-family: 'Times New Roman', Times, serif, Tahoma;
            font-size: 4rem;
            font-weight: 300;
            letter-spacing: 6px;
            color: #f3e8ff;
            text-transform: uppercase;
            margin-bottom: -5px;
            text-shadow: 0 0 25px rgba(167, 139, 250, 0.3);
        }
        .brand-sub {
            font-size: 1.1rem;
            letter-spacing: 5px;
            color: #a78bfa;
            text-transform: uppercase;
            margin-bottom: 25px;
            font-weight: 400;
        }
        .tagline {
            font-style: italic;
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }
        /* دکمه ورود */
        .enter-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px 45px;
            border: 1px solid rgba(167, 139, 250, 0.4);
            border-radius: 30px;
            color: #e9d5ff;
            text-decoration: none;
            font-size: 1rem;
            background: rgba(88, 28, 135, 0.15);
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        .enter-btn:hover {
            background: rgba(126, 34, 206, 0.3);
            border-color: rgba(167, 139, 250, 0.8);
            box-shadow: 0 0 20px rgba(167, 139, 250, 0.2);
        }/* استایل منوی کشویی جدید */
        .side-menu {
            position: fixed;
            top: 0;
            right: -320px;
            width: 300px;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(15px);
            box-shadow: -5px 0 25px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            padding: 40px 30px;
            transition: 0.4s ease-in-out;
            z-index: 100;
            text-align: right;
        }
        .side-menu.active {
            right: 0;
        }
        .close-btn {
            align-self: flex-start;
            font-size: 2rem;
            color: #a78bfa;
            cursor: pointer;
            margin-bottom: 30px;
            background: none;
            border: none;
        }
        .side-menu ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .side-menu ul li a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.3s;
            cursor: pointer;
        }
        .side-menu ul li a:hover {
            color: #a78bfa;
            padding-right: 8px;
        }
    </style>
</head>
<body>
    <!-- منوی کشویی -->
    <div class="side-menu" id="sideMenu">
        <button class="close-btn" onclick="toggleMenu()">×</button>
        <ul>
            <li><a href="#">👤 Profile</a></li>
            <li><a href="#">❤️ Favorite</a></li>
            <li><a href="#">🎶 Playlist</a></li>
            <li><a onclick="toggleTheme()">🎨 Theme</a></li>
            <li><a href="#">📩 Contact us</a></li>
        </ul>
    </div>
   <div class="top-bar">
        <div class="icon-wave">
            <span></span><span></span><span></span><span></span>
        </div>
        <div class="menu-icon">
            <span></span><span></span><span></span>
        </div>
    </div>

    <div class="content">
        <!-- خط موج صوتی بالای نام -->
        <svg class="audio-wave-top" viewBox="0 0 200 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 20H55L65 8L75 32L85 14L95 26L105 18L115 22L125 10L135 30L145 20H198" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>

        <h1 class="brand-title">TANINFY</h1>
        <div class="brand-sub">M U S I C</div>
        <p class="tagline">Feel the Music. Live the Mood.</p>

        <a href="#" class="enter-btn">
            Enter <span>→</span>
        </a>
    </div>

</body>
    <script>
        function toggleMenu() {
            const menu = document.getElementById('sideMenu');
            menu.classList.toggle('active');
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
        }
    </script>
</html>
