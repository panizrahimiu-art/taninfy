<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طنین‌فای | Taninfy Music</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <style>
        :root {
            --bg-color: #0b0710;
            --grad-1: rgba(88, 28, 135, 0.25);
            --grad-2: rgba(76, 29, 149, 0.2);
            --text-main: #ffffff;
            --text-sub: #a78bfa;
            --title-color: #f3e8ff;
            --tagline-color: #94a3b8;
            --btn-bg: rgba(88, 28, 135, 0.15);
            --btn-border: rgba(167, 139, 250, 0.4);
            --menu-bg: rgba(30, 15, 50, 0.50);
            --modal-bg: rgba(20, 10, 35, 0.85);
        }

        body.light-theme {
            --bg-color: #f3e8ff;
            --grad-1: rgba(192, 132, 252, 0.3);
            --grad-2: rgba(216, 180, 254, 0.4);
            --text-main: #2e1065;
            --text-sub: #7e22ce;
            --title-color: #3b0764;
            --tagline-color: #6b21a8;
            --btn-bg: rgba(168, 85, 247, 0.15);
            --btn-border: rgba(126, 34, 206, 0.4);
            --menu-bg: rgba(243, 232, 255, 0.50);
            --modal-bg: rgba(255, 255, 255, 0.90);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        
        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 80% 20%, var(--grad-1) 0%, transparent 40%),
                radial-gradient(circle at 20% 80%, var(--grad-2) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* هدر بالا (منو سمت چپ) */
        .top-bar {
            position: absolute;
            top: 30px;
            left: 40px;
            right: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .icon-wave {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 20px;
        }
        .icon-wave span {
            width: 3px;
            background: var(--text-sub);
            animation: pulse 1.2s infinite ease-in-out;
        }
        .icon-wave span:nth-child(1) { height: 10px; animation-delay: 0.1s; }
        .icon-wave span:nth-child(2) { height: 18px; animation-delay: 0.3s; }
        .icon-wave span:nth-child(3) { height: 14px; animation-delay: 0.2s; }
        .icon-wave span:nth-child(4) { height: 8px; animation-delay: 0.4s; }

        .menu-icon {
            display: flex;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 10px;
        }
        .menu-icon span {
            width: 24px;
            height: 2px;
            background: var(--text-sub);
            transition: 0.3s;
        }

        /* منوی کشویی سمت چپ */
        .side-menu {
            position: fixed;
            top: 0;
            left: -320px;
            width: 300px;
            height: 100%;
            background: var(--menu-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 5px 0 25px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            padding: 40px 30px;
            transition: 0.4s ease-in-out;
            z-index: 100;
            text-align: right;
        }
        .side-menu.active {
            left: 0;
        }
        .close-btn {
            align-self: flex-start;
            font-size: 2rem;
            color: var(--text-sub);
            cursor: pointer;
            margin-bottom: 30px;
            background: none;
            border: none;
        }
        .side-menu ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .side-menu ul li a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.3s;
            cursor: pointer;
        }
        .side-menu ul li a:hover {
            color: var(--text-sub);
            padding-right: 8px;
        }

        .menu-divider {
            width: 100%;
            height: 1px;
            background: rgba(167, 139, 250, 0.2);
            margin: 2px 0;
        }

        /* محتوای اصلی */
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 600px;
            width: 100%;
        }
        .audio-wave-top {
            width: 150px;
            height: 35px;
            margin-bottom: 10px;
            opacity: 0.8;
        }
        .brand-title {
            font-family: 'Times New Roman', Times, serif, Tahoma;
            font-size: 4rem;
            font-weight: 300;
            letter-spacing: 6px;
            color: var(--title-color);
            text-transform: uppercase;
            margin-bottom: -5px;
            text-shadow: 0 0 25px rgba(167, 139, 250, 0.3);
        }
        .brand-sub {
            font-size: 1.1rem;
            letter-spacing: 5px;
            color: var(--text-sub);
            text-transform: uppercase;
            margin-bottom: 25px;
            font-weight: 400;
        }
        .tagline {
            font-style: italic;
            color: var(--tagline-color);
            font-size: 1rem;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        /* کادر جستجو */
        .search-box {
            position: relative;
            width: 100%;
            max-width: 380px;
        }
        .search-input {
            width: 100%;
            padding: 14px 20px 14px 45px;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 30px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        .search-input::placeholder {
            color: var(--tagline-color);
        }
        .search-input:focus {
            border-color: var(--text-sub);
            box-shadow: 0 0 20px rgba(167, 139, 250, 0.3);
        }
        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
            font-size: 1rem;
            pointer-events: none;
        }

        /* استایل مدال پروفایل */
        .profile-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 200;
        }
        .profile-modal.active {
            opacity: 1;
            pointer-events: auto;
        }
        .profile-card {
            background: var(--modal-bg, rgba(20, 10, 35, 0.85));
            border: 1px solid var(--btn-border);
            border-radius: 24px;
            width: 90%;
            max-width: 400px;
            padding: 35px 25px;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .profile-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            color: var(--text-sub);
            cursor: pointer;
            background: none;
            border: none;
        }
        .profile-avatar-container {
            position: relative;
            margin-bottom: 15px;
        }
        .profile-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid var(--text-sub);
            object-fit: cover;
            background: #2a1b4e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
        }
        .profile-badge {
            font-size: 0.75rem;
            background: linear-gradient(45deg, #7e22ce, #a78bfa);
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .profile-name {
            font-size: 1.4rem;
            color: var(--title-color);
            margin-bottom: 2px;
        }
        .profile-email {
            font-size: 0.85rem;
            color: var(--tagline-color);
            margin-bottom: 25px;
        }
        .profile-stats {
            display: flex;
            justify-content: space-around;
            width: 100%;
            border-top: 1px solid rgba(167, 139, 250, 0.15);
            border-bottom: 1px solid rgba(167, 139, 250, 0.15);
            padding: 15px 0;
            margin-bottom: 25px;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-sub);
        }
        .stat-label {
            font-size: 0.75rem;
            color: var(--tagline-color);
        }
        .profile-actions {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .profile-btn {
            flex: 1;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid var(--btn-border);
            background: var(--btn-bg);
            color: var(--text-main);
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .profile-btn:hover {
            border-color: var(--text-sub);
            box-shadow: 0 0 15px rgba(167, 139, 250, 0.2);
        }

        /* استایل مدال ورود و ثبت نام */
        .auth-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 210;
        }
        .auth-modal.active {
            opacity: 1;
            pointer-events: auto;
        }
        .auth-card {
            background: var(--modal-bg, rgba(20, 10, 35, 0.9));
            border: 1px solid var(--btn-border);
            border-radius: 24px;
            width: 90%;
            max-width: 380px;
            padding: 30px 25px;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }
        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(167, 139, 250, 0.2);
            padding-bottom: 10px;
        }
        .auth-tab {
            flex: 1;
            background: none;
            border: none;
            color: var(--tagline-color);
            font-size: 1rem;
            cursor: pointer;
            padding: 5px 0;
            transition: 0.3s;
        }
        .auth-tab.active {
            color: var(--text-sub);
            font-weight: bold;
            border-bottom: 2px solid var(--text-sub);
        }
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .auth-input {
            width: 100%;
            padding: 12px 15px;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }
        .auth-input:focus {
            border-color: var(--text-sub);
        }
        .auth-submit-btn {
            padding: 12px;
            border-radius: 20px;
            border: none;
            background: linear-gradient(45deg, #7e22ce, #a78bfa);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }
        .auth-submit-btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px rgba(167, 139, 250, 0.4);
        }
    </style>
</head>
<body>

    <!-- هدر بالا -->
    <div class="top-bar">
        <div class="menu-icon" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
        <div class="icon-wave">
            <span></span><span></span><span></span><span></span>
        </div>
    </div>

    <!-- منوی کشویی سمت چپ -->
    <div class="side-menu" id="sideMenu">
        <button class="close-btn" onclick="toggleMenu()">×</button>
        <ul>
            <li><a onclick="openProfile()"> Profile</a></li>
            <div class="menu-divider"></div>
            <li><a href="#"> Favorite</a></li>
            <div class="menu-divider"></div>
            <li><a href="#">🎶 Playlist</a></li>
            <div class="menu-divider"></div>
            <li><a onclick="toggleTheme()"> Theme</a></li>
            <div class="menu-divider"></div>
            <li><a href="#"> Contact us</a></li>
            <div class="menu-divider"></div>
            <li><a onclick="openAuthModal()"> Log In / Sign In</a></li>
            <div class="menu-divider"></div>
        </ul>
    </div>

    <!-- محتوای اصلی -->
    <div class="content">
        <svg class="audio-wave-top" viewBox="0 0 200 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 20H55L65 8L75 32L85 14L95 26L105 18L115 22L125 10L135 30L145 20H198" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>

        <h1 class="brand-title">TANINFY</h1>
        <div class="brand-sub">M U S I C</div>
        <p class="tagline">Feel the Music. Live the Mood.</p>

        <div class="search-box">
            <input type="text" class="search-input" placeholder="جستجوی آهنگ، هنرمند یا سبک...">
            <span class="search-icon">🔍</span>
        </div>
    </div>

    <!-- کارت مدال پروفایل -->
    <div class="profile-modal" id="profileModal">
        <div class="profile-card">
           <button class="profile-close" onclick="closeProfile()">×</button>
            <div class="profile-avatar-container">
                <div class="profile-avatar">👤</div>
            </div>
            <span class="profile-badge">VIP Member</span>
            <h3 class="profile-name">مهمان</h3>
            <p class="profile-email">برای ورود کلیک کنید</p>

            <div class="profile-stats">
                <div class="stat-item">
                    <span class="stat-value">۰</span>
                    <span class="stat-label">علاقه‌مندی‌ها</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">۰</span>
                    <span class="stat-label">پلی‌لیست‌ها</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">۰ ساعت</span>
                    <span class="stat-label">پخش موزیک</span>
                </div>
            </div>

            <div class="profile-actions">
                <button class="profile-btn" onclick="openAuthModal(); closeProfile();">ورود / ثبت‌نام</button>
                <button class="profile-btn" onclick="logoutUser()" style="border-color: rgba(239, 68, 68, 0.4); color: #f87171;">خروج</button>
            </div>
        </div>
    </div>

    <!-- کارت مدال ورود و ثبت نام -->
    <div class="auth-modal" id="authModal">
        <div class="auth-card">
            <button class="profile-close" onclick="closeAuthModal()">×</button>
            <div class="auth-tabs">
                <button class="auth-tab active" id="tabLogin" onclick="switchAuthMode('login')">ورود</button>
                <button class="auth-tab" id="tabRegister" onclick="switchAuthMode('register')">ثبت‌نام</button>
            </div>
            
            <form class="auth-form" onsubmit="handleAuth(event)">
                <input type="text" class="auth-input" id="authName" placeholder="نام و نام خانوادگی" style="display: none;">
                <input type="email" class="auth-input" id="authEmail" placeholder="ایمیل" required>
                <input type="password" class="auth-input" id="authPassword" placeholder="رمز عبور" required>
                <button type="submit" class="auth-submit-btn" id="authSubmitBtn">ورود به حساب</button>
            </form>
        </div>
    </div>

    <script>
        let isLoginMode = true;

        function toggleMenu() {
            const menu = document.getElementById('sideMenu');
            menu.classList.toggle('active');
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
        }

        function openProfile() {
            const menu = document.getElementById('sideMenu');
            if(menu) menu.classList.remove('active');
            document.getElementById('profileModal').classList.add('active');
        }

        function closeProfile() {
            document.getElementById('profileModal').classList.remove('active');
        }

        function openAuthModal() {
            const menu = document.getElementById('sideMenu');
            if(menu) menu.classList.remove('active');
            document.getElementById('authModal').classList.add('active');
        }

        function closeAuthModal() {
            document.getElementById('authModal').classList.remove('active');
        }

        function switchAuthMode(mode) {
            isLoginMode = mode === 'login';
            document.getElementById('tabLogin').classList.toggle('active', isLoginMode);
            document.getElementById('tabRegister').classList.toggle('active', !isLoginMode);
            document.getElementById('authName').style.display = isLoginMode ? 'none' : 'block';
            document.getElementById('authSubmitBtn').innerText = isLoginMode ? 'ورود به حساب' : 'ایجاد حساب کاربری';
        }
        function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value;
            const name = isLoginMode ? email.split('@')[0] : document.getElementById('authName').value;
            
            // ذخیره کاربر در مرورگر
            localStorage.setItem('taninfy_user', JSON.stringify({ name: name, email: email }));
            
            // بروزرسانی مشخصات در پروفایل
            document.querySelector('.profile-name').innerText = name;
            document.querySelector('.profile-email').innerText = email;
            
            alert(isLoginMode ? 'با موفقیت وارد شدید!' : 'حساب شما با موفقیت ساخته شد!');
            closeAuthModal();
        }

        function logoutUser() {
            localStorage.removeItem('taninfy_user');
            document.querySelector('.profile-name').innerText = 'مهمان';
            document.querySelector('.profile-email').innerText = 'برای ورود کلیک کنید';
            alert('از حساب خود خارج شدید.');
            closeProfile();
        }

        // بررسی ورود کاربر هنگام بارگذاری صفحه
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('taninfy_user');
            if (savedUser) {
                const user = JSON.parse(savedUser);
                document.querySelector('.profile-name').innerText = user.name;
                document.querySelector('.profile-email').innerText = user.email;
            }
        });
    </script>
</body>
</html>
