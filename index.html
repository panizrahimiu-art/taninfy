<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Taninfy</title>

<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #080506;
    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;
}


/* =========================
   SONG LIST
========================= */

.song-list {
    width: 100%;
    max-width: 700px;

    margin: 0 auto;

    padding: 30px 20px;
}

.song-item {
    width: 100%;

    display: flex;
    align-items: center;

    gap: 15px;

    padding: 12px;

    margin-bottom: 10px;

    border-radius: 16px;

    background: #12090d;

    cursor: pointer;

    transition: .2s;
}

.song-item:active {
    transform: scale(.98);
}

.song-item img {
    width: 58px;
    height: 58px;

    object-fit: cover;

    border-radius: 12px;
}

.song-text {
    min-width: 0;
}

.song-text h3 {
    font-size: 16px;
    font-weight: 500;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.song-text p {
    margin-top: 5px;

    color: #a95a73;

    font-size: 13px;
}


/* =========================
   FULL SCREEN PLAYER
========================= */

.music-player {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100dvh;

    z-index: 9999;

    display: none;

    flex-direction: column;

    padding:
        max(10px, env(safe-area-inset-top))
        24px
        max(20px, env(safe-area-inset-bottom));

    overflow: hidden;

    background:
        linear-gradient(
            145deg,
            #050505 0%,
            #0b0507 40%,
            #17070d 75%,
            #080506 100%
        );
}


/* =========================
   BACKGROUND GLOW
========================= */

.music-player::before {

    content: "";

    position: absolute;

    width: 500px;
    height: 500px;

    top: -300px;
    right: -250px;

    background: #5a102b;

    opacity: .14;

    filter: blur(110px);

    border-radius: 50%;

    pointer-events: none;
}

.music-player::after {

    content: "";

    position: absolute;

    width: 450px;
    height: 450px;

    bottom: -300px;
    left: -250px;

    background: #4a0c22;

    opacity: .13;

    filter: blur(100px);

    border-radius: 50%;

    pointer-events: none;
}


/* =========================
   TOP BAR
========================= */

.top-bar {

    position: relative;

    z-index: 10;

    height: 58px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: space-between;
}


/* CLOSE */

.close-button {

    width: 44px;
    height: 44px;

    border: none;

    background: transparent;

    position: relative;

    cursor: pointer;
}

.close-button::before,
.close-button::after {

    content: "";

    position: absolute;

    width: 19px;
    height: 2px;

    top: 21px;

    background: white;

    border-radius: 10px;
}

.close-button::before {

    left: 5px;

    transform: rotate(45deg);
}

.close-button::after {

    right: 5px;

    transform: rotate(-45deg);
}


/* MORE */

.more-button {

    border: none;

    background: transparent;

    color: white;

    font-size: 22px;

    letter-spacing: 4px;

    cursor: pointer;

    padding: 8px;
}


/* =========================
   PLAYER CONTENT
========================= */

.player-content {

    position: relative;

    z-index: 5;

    width: 100%;

    max-width: 520px;

    margin: 0 auto;

    flex: 1;

    display: flex;

    flex-direction: column;

    min-height: 0;
}


/* =========================
   COVER
========================= */

.cover-wrapper {

    width: 100%;

    display: flex;

    justify-content: center;

    margin-top:
        clamp(
            15px,
            4vh,
            50px
        );
}


.album-cover {

    width:
        min(
            88vw,
            440px
        );

    aspect-ratio: 1 / 1;

    object-fit: cover;

    border-radius: 28px;

    display: block;

    box-shadow:
        0 25px 70px
        rgba(
            0,
            0,
            0,
            .55
        );
}


/* =========================
   SONG INFO
========================= */

.song-section {

    width: 100%;

    margin-top:
        clamp(
            22px,
            4vh,
            38px
        );
}


.song-row {

    width: 100%;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;
}


.song-details {

    min-width: 0;
}


.song-title {

    color: white;

    font-size:
        clamp(
            21px,
            6vw,
            31px
        );

    font-weight: 500;

    line-height: 1.25;

    letter-spacing: -.4px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.song-artist {

    margin-top: 7px;

    color: #a95570;

    font-size: 15px;

    font-weight: 500;

    letter-spacing: 3px;
}


/* =========================
   FAVORITE
========================= */

.favorite-button {

    width: 45px;
    height: 45px;

    flex-shrink: 0;

    border: none;

    background: transparent;

    color: white;

    font-size: 38px;

    line-height: 1;

    cursor: pointer;
}

.favorite-button.active {

    color: #b51f4d;
}


/* =========================
   PROGRESS
========================= */

.progress-section {

    width: 100%;

    margin-top:
        clamp(
            25px,
            4vh,
            40px
        );
}


.progress-bar {

    width: 100%;

    height: 4px;

    appearance: none;

    -webkit-appearance: none;

    border: none;

    outline: none;

    border-radius: 20px;

    cursor: pointer;

    background:
        linear-gradient(
            to right,
            #a92750 0%,
            #a92750 var(--progress, 0%),
            #43242e var(--progress, 0%),
            #43242e 100%
        );
}


/* CHROME */

.progress-bar::-webkit-slider-thumb {

    appearance: none;

    -webkit-appearance: none;

    width: 17px;
    height: 17px;

    background: white;

    border: none;

    border-radius: 50%;
}


/* FIREFOX */

.progress-bar::-moz-range-thumb {

    width: 17px;
    height: 17px;

    background: white;

    border: none;

    border-radius: 50%;
}


.time-row {

    display: flex;

    justify-content: space-between;

    margin-top: 8px;

    color: #9b9698;

    font-size: 13px;
}


/* =========================
   CONTROLS
========================= */

.controls {

    width: 100%;

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-top:
        clamp(
            25px,
            5vh,
            55px
        );

    padding-bottom: 15px;
}


.control-button {

    width: 44px;
    height: 44px;

    border: none;

    background: transparent;

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;
}


.control-button svg {

    width: 27px;
    height: 27px;

    fill: none;

    stroke: currentColor;

    stroke-width: 1.8;

    stroke-linecap: round;

    stroke-linejoin: round;
}


.control-button.active {

    color: #b72a53;
}


/* =========================
   PLAY BUTTON
========================= */

.play-button {

    width: 78px;
    height: 78px;

    border-radius: 50%;

    border:
        1px solid
        rgba(
            170,
            35,
            75,
            .5
        );

    background: #250b16;

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;
}


.play-button:active {

    transform: scale(.92);
}


.play-button svg {

    width: 30px;
    height: 30px;

    fill: currentColor;
}


/* =========================
   MOBILE SMALL SCREEN
========================= */

@media (max-height: 700px) {

    .cover-wrapper {
        margin-top: 10px;
    }

    .album-cover {
        width: min(68vw, 320px);
    }

    .song-section {
        margin-top: 15px;
    }

    .progress-section {
        margin-top: 18px;
    }

    .controls {
        margin-top: 18px;
    }
}


/* =========================
   DESKTOP
========================= */

@media (min-width: 700px) {

    .music-player {
        padding-left: 7vw;
        padding-right: 7vw;
    }

    .album-cover {
        width: min(58vh, 500px);
    }
}

</style>
</head>


<body>


<!-- =================================
     SONG LIST
================================= -->

<div class="song-list">


    <!-- SONG 1 -->

    <div
        class="song-item"
        onclick="openSong(
            'Değiştiremezsin Yazılmışsa',
            'BLOK3',
            'images/blok3.jpg',
            'music/blok3.mp3'
        )">

        <img src="images/blok3.jpg">

        <div class="song-text">

            <h3>
                Değiştiremezsin Yazılmışsa
            </h3>

            <p>
                BLOK3
            </p>

        </div>

    </div>


    <!-- SONG 2 -->

    <div
        class="song-item"
        onclick="openSong(
            'نام آهنگ دوم',
            'نام خواننده دوم',
            'images/song2.jpg',
            'music/song2.mp3'
        )">

        <img src="images/song2.jpg">

        <div class="song-text">

            <h3>
                نام آهنگ دوم
            </h3>

            <p>
                نام خواننده دوم
            </p>

        </div>

    </div>


    <!-- SONG 3 -->

    <div
        class="song-item"
        onclick="openSong(
            'نام آهنگ سوم',
            'نام خواننده سوم',
            'images/song3.jpg',
            'music/song3.mp3'
        )">

        <img src="images/song3.jpg">

        <div class="song-text">

            <h3>
                نام آهنگ سوم
            </h3>

            <p>
                نام خواننده سوم
            </p>

        </div>

    </div>

</div>



<!-- =================================
     FULL SCREEN PLAYER
================================= -->

<div
    class="music-player"
    id="musicPlayer">


    <!-- TOP -->

    <div class="top-bar">

        <button
            class="close-button"
            id="closePlayer">
        </button>

        <button
            class="more-button">
            •••
        </button>

    </div>


    <!-- PLAYER -->

    <main class="player-content">


        <!-- COVER -->

        <div class="cover-wrapper">

            <img
                id="albumCover"
                class="album-cover"
                src=""
                alt="Album Cover">

        </div>


        <!-- INFO -->

        <section class="song-section">

            <div class="song-row">

                <div class="song-details">

                    <h1
                        class="song-title"
                        id="songTitle">
                    </h1>

                    <p
                        class="song-artist"
                        id="songArtist">
                    </p>

                </div>


                <button
                    class="favorite-button"
                    id="favoriteButton">
                    ♡
                </button>

            </div>

        </section>


        <!-- PROGRESS -->

        <section class="progress-section">

            <input
                type="range"
                class="progress-bar"
                id="progressBar"
                min="0"
                max="100"
                value="0">

            <div class="time-row">

                <span id="currentTime">
                    0:00
                </span>

                <span id="totalTime">
                    0:00
                </span>

            </div>

        </section>


        <!-- CONTROLS -->

        <div class="controls">


            <!-- SHUFFLE -->

            <button
                class="control-button"
                id="shuffleButton">

                <svg viewBox="0 0 24 24">

                    <path
                        d="M3 7h3c5 0 6 10 11 10h4"/>

                    <path
                        d="M18 14l3 3-3 3"/>

                    <path
                        d="M3 17h3c1.5 0 2.7-.8 3.6-2"/>

                    <path
                        d="M15.4 9c1-1.2 2-2 3.6-2h2"/>

                    <path
                        d="M18 4l3 3-3 3"/>

                </svg>

            </button>


            <!-- PREVIOUS -->

            <button
                class="control-button"
                id="previousButton">

                <svg viewBox="0 0 24 24">

                    <path d="M6 5v14"/>

                    <path
                        d="M19 6l-9 6 9 6z"/>

                </svg>

            </button>


            <!-- PLAY -->

            <button
                class="play-button"
                id="playButton">

                <svg
                    id="playIcon"
                    viewBox="0 0 24 24">

                    <path
                        d="M8 5v14l11-7z"/>

                </svg>

            </button>


            <!-- NEXT -->

            <button
                class="control-button"
                id="nextButton">

                <svg viewBox="0 0 24 24">

                    <path d="M18 5v14"/>

                    <path
                        d="M5 6l9 6-9 6z"/>

                </svg>

            </button>


            <!-- REPEAT -->

            <button
                class="control-button"
                id="repeatButton">

                <svg viewBox="0 0 24 24">

                    <path
                        d="M17 2l4 4-4 4"/>

                    <path
                        d="M3 11V9a3 3 0 013-3h15"/>

                    <path
                        d="M7 22l-4-4 4-4"/>

                    <path
                        d="M21 13v2a3 3 0 01-3 3H3"/>

                </svg>

            </button>

        </div>

    </main>

</div>


<!-- AUDIO -->

<audio id="audio"></audio>


<script>

/* =================================
   ELEMENTS
================================= */

const musicPlayer =
    document.getElementById(
        "musicPlayer"
    );

const audio =
    document.getElementById(
        "audio"
    );

const albumCover =
    document.getElementById(
        "albumCover"
    );

const songTitle =
    document.getElementById(
        "songTitle"
    );

const songArtist =
    document.getElementById(
        "songArtist"
    );

const progressBar =
    document.getElementById(
        "progressBar"
    );

const currentTime =
    document.getElementById(
        "currentTime"
    );

const totalTime =
    document.getElementById(
        "totalTime"
    );

const playButton =
    document.getElementById(
        "playButton"
    );

const playIcon =
    document.getElementById(
        "playIcon"
    );

const favoriteButton =
    document.getElementById(
        "favoriteButton"
    );

const shuffleButton =
    document.getElementById(
        "shuffleButton"
    );

const repeatButton =
    document.getElementById(
        "repeatButton"
    );

const closePlayer =
    document.getElementById(
        "closePlayer"
    );


/* =================================
   CURRENT SONG
================================= */

let currentSong = null;


/* =================================
   OPEN SONG
================================= */

function openSong(
    title,
    artist,
    cover,
    music
) {

    currentSong = {
        title: title,
        artist: artist,
        cover: cover,
        music: music
    };


    /* CHANGE TITLE */

    songTitle.textContent =
        title;


    /* CHANGE ARTIST */

    songArtist.textContent =
        artist;


    /* CHANGE COVER */

    albumCover.src =
        cover;


    /* CHANGE AUDIO */

    audio.src =
        music;


    /* RESET */

    audio.currentTime = 0;

    progressBar.value = 0;

    progressBar.style.setProperty(
        "--progress",
        "0%"
    );

    currentTime.textContent =
        "0:00";


    /* RESET FAVORITE */

    favoriteButton.classList.remove(
        "active"
    );

    favoriteButton.textContent =
        "♡";


    /* OPEN */

    musicPlayer.style.display =
        "flex";

    document.body.style.overflow =
        "hidden";


    /* LOAD */

    audio.load();


    /* PLAY */

    audio.play().catch(() => {});

}


/* =================================
   CLOSE PLAYER
================================= */

closePlayer.addEventListener(
    "click",
    function () {

        audio.pause();

        musicPlayer.style.display =
            "none";

        document.body.style.overflow =
            "";

    }
);


/* =================================
   PLAY / PAUSE
================================= */

playButton.addEventListener(
    "click",
    function () {

        if (audio.paused) {

            audio.play();

        } else {

            audio.pause();

        }

    }
);


/* =================================
   PLAY ICON
================================= */

audio.addEventListener(
    "play",
    function () {

        playIcon.innerHTML = `
            <path d="M7 5h4v14H7z"/>
            <path d="M13 5h4v14h-4z"/>
        `;

    }
);


audio.addEventListener(
    "pause",
    function () {

        playIcon.innerHTML = `
            <path d="M8 5v14l11-7z"/>
        `;

    }
);


/* =================================
   LOADED
================================= */

audio.addEventListener(
    "loadedmetadata",
    function () {

        totalTime.textContent =
            formatTime(
                audio.duration
            );

    }
);


/* =================================
   TIME UPDATE
================================= */

audio.addEventListener(
    "timeupdate",
    function () {

        if (!audio.duration)
            return;


        const percent =
            (
                audio.currentTime /
                audio.duration
            ) * 100;


        progressBar.value =
            percent;


        progressBar.style.setProperty(
            "--progress",
            percent + "%"
        );


        currentTime.textContent =
            formatTime(
                audio.currentTime
            );

    }
);


/* =================================
   SEEK
================================= */

progressBar.addEventListener(
    "input",
    function () {

        if (!audio.duration)
            return;


        audio.currentTime =
            (
                progressBar.value /
                100
            ) * audio.duration;

    }
);


/* =================================
   FORMAT TIME
================================= */

function formatTime(seconds) {

    if (
        !seconds ||
        isNaN(seconds)
    ) {
        return "0:00";
    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        Math.floor(
            seconds % 60
        )
        .toString()
        .padStart(2, "0");


    return (
        minutes +
        ":" +
        secs
    );
}


/* =================================
   FAVORITE
================================= */

favoriteButton.addEventListener(
    "click",
    function () {

        this.classList.toggle(
            "active"
        );


        this.textContent =
            this.classList.contains(
                "active"
            )
            ? "♥"
            : "♡";

    }
);


/* =================================
   SHUFFLE
================================= */

shuffleButton.addEventListener(
    "click",
    function () {

        this.classList.toggle(
            "active"
        );

    }
);


/* =================================
   REPEAT
================================= */

repeatButton.addEventListener(
    "click",
    function () {

        this.classList.toggle(
            "active"
        );


        audio.loop =
            this.classList.contains(
                "active"
            );

    }
);


/* =================================
   PREVIOUS
================================= */

document
    .getElementById(
        "previousButton"
    )
    .addEventListener(
        "click",
        function () {

            audio.currentTime = 0;

        }
    );


/* =================================
   NEXT
================================= */

document
    .getElementById(
        "nextButton"
    )
    .addEventListener(
        "click",
        function () {

            audio.currentTime =
                audio.duration;

        }
    );


/* =================================
   KEYBOARD
================================= */

document.addEventListener(
    "keydown",
    function (event) {

        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            if (
                musicPlayer.style.display ===
                "flex"
            ) {

                if (audio.paused) {
                    audio.play();
                } else {
                    audio.pause();
                }

            }

        }

    }
);

</script>

</body>
</html>
